<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurum Ops — Pipeline & Agile Command Center</title>
  <meta name="description" content="Internal agile board, client pipeline and turnover-SLA command center." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230b0b10'/><text x='50' y='68' font-size='58' text-anchor='middle' fill='%23e8c56a' font-family='Georgia' font-weight='bold'>A</text></svg>" />
</head>
<body>
  <!-- login -->
  <div id="login" class="login-screen hidden">
    <div class="login-card">
      <div class="login-logo">A</div>
      <div class="login-title">AURUM OPS</div>
      <div class="login-sub">Pipeline · Agile · Turnover SLA</div>
      <form id="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" class="input" type="email" autocomplete="username" value="avi@aurum.internal" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" class="input" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-gold" style="width:100%; justify-content:center; padding:12px;" type="submit">
          Enter Command Center
        </button>
      </form>
      <div class="login-hint">
        Admin access — <code>avi@aurum.internal</code> / <code>aurum-2026</code><br />
        Roles: admin · lead · qa · dev · viewer
      </div>
    </div>
  </div>

  <!-- app shell -->
  <div id="app" class="hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div class="brand-text">
          <span class="brand-name">AURUM</span>
          <span class="brand-sub">Ops Command</span>
        </div>
      </div>

      <div class="nav-section">Overview</div>
      <div class="nav-item" data-route="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </div>
      <div class="nav-item" data-route="board">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="11" rx="1.5"/><rect x="16" y="4" width="5" height="14" rx="1.5"/></svg>
        Agile Board
        <span class="nav-badge" id="nav-board-count">0</span>
      </div>

      <div class="nav-section">Delivery</div>
      <div class="nav-item" data-route="pipeline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h10M4 12h16M4 18h7"/><circle cx="18" cy="6" r="2.4"/><circle cx="14" cy="18" r="2.4"/></svg>
        Client Pipeline
        <span class="nav-badge" id="nav-pipeline-count">0</span>
      </div>
      <div class="nav-item" data-route="projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Projects
      </div>
      <div class="nav-item" data-route="roadmap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M12 3l6 4-6 4M12 21l-6-4 6-4" stroke-linejoin="round"/></svg>
        Roadmap &amp; Excalidraw
      </div>

      <div class="nav-section">Intelligence</div>
      <div class="nav-item" data-route="ai">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M18.5 15.5l.9 2.3 2.3.7-2.3.7-.9 2.3-.9-2.3-2.3-.7 2.3-.7z"/></svg>
        AI Priorities
      </div>
      <div class="nav-item" data-route="team">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.9-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.4c2.3.2 4 1.7 4.5 4.6"/></svg>
        Team &amp; SLA
      </div>

      <div class="sidebar-foot"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="page-title" id="page-title">Dashboard</div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <div class="modal-root" id="modal-root">
    <div class="modal-backdrop" data-close></div>
    <div class="modal" id="modal-box"></div>
  </div>

  <div class="toast-root" id="toast-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>

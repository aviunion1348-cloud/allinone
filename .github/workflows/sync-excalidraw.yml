name: Sync Excalidraw Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - arena/7e2d7a9e-allinone
    paths:
      - scripts/sync-excalidraw.mjs
      - .github/workflows/sync-excalidraw.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch + decrypt Excalidraw scene
        run: node scripts/sync-excalidraw.mjs

      - name: Commit pipeline document
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pipeline.excalidraw.json docs/pipeline.md
          if git diff --cached --quiet; then
            echo "Pipeline document unchanged."
          else
            git commit -m "docs: sync excalidraw pipeline & roadmap [skip ci]"
            git push
          fi

name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit (fail on high+ vulnerabilities)
        run: npm audit --audit-level=high
      - name: Unit + SPA smoke tests (self-booting)
        run: npm test

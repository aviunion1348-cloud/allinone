name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit (fail on high+ vulnerabilities)
        run: npm audit --audit-level=high
      - name: Unit + smoke + boot E2E tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log || {
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git add test-output.log
            git diff --cached --quiet || git commit -m "ci: test failure log"
            git push || true
            exit 1
          }
